<!DOCTYPE html>
<html dir="rtl" lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Style/index.css">
    <link rel="stylesheet" href="Style/Login.css">
</head>

<body>
    <div class="header">

        <div class="main-Header">
            <img src="Image/header/icon/header-logo.png" alt="لوگوی کاستومی" class="header-logo">
            <div class="center-header">
                <input type="text" placeholder="جستجو" class="searchbar">
                <img src="Image/header/icon/search-vector.png" alt="جستجو" class="search-icon" height="25px"
                    width="25px">

            </div>
            <div class="left-header">
                <div class="login">
                    <img src="Image/header/icon/Login-vector.png" alt="ورود" class="login-icon" height="30px"
                        width="30px">
                    <p> ورود| ثبت نام</p>
                </div>
                <div class="shoppingcart">
                    <img src="Image/header/icon/shopping-cart-vector.png" alt="سبد خرید" class="shoppingcart-icon"
                        height="30px" width="30px">
                    <p>سبد خرید</p>
                </div>

            </div>
        </div>
    </div>

    <div class="maincontent">
        <div class="right-Part">
            <p class="welcome-text">به کاستومی خوش آمدید</p>
            <p class="login-signup-text">ورود|ثبت‌نام</p>
            <p class="username-text">نام کاربری</p>
            <input class="username" type="text">
            <p class="password-text">کلمه عبور</p>
            <input type="password" name="" id="" class="password">
            <p class="forgetpassword">فراموشی رمزعبور</p>
            <p class="roleMessage">ورود و عضویت شما به منزله پذیرفتن قوانین و مقررات می باشد.</p>
            <button type="button" class="login-button">ورود به سایت</button>
            <button typr="button" class="login-withgoole">
                <img src="Image/pages/Login/icon/google-icon.png" alt="" class="google-icon">
                ورود با حساب گوگل
            </button>
            <p class="signup-text">ثبت نام</p>

        </div>
        <div class="left-Part">
            <img src="Image/pages/Login/photo.png" class="left-Part-image" alt="SADDSA">

        </div>

    </div>

</body>



</html>
